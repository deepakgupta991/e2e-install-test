
name: Matrix

on:
  workflow_dispatch:
    inputs:
      level:
        description: ""
        type: choice
        options: [smoke, parallel, stress, soak]
        default: smoke
      version:
        description: ""
        type: string
        default: ""
      os:
        description: ""
        type: string
        default: "ubuntu-latest,macos-latest,windows-latest"
      python:
        description: ""
        type: string
        default: "3.12,3.13,3.14"
      methods:
        description: ""
        type: string
        default: "pypi,wheel,sdist"
      installers:
        description: ""
        type: string
        default: "pip,uv"
      images:
        description: ""
        type: string
        default: "ubuntu:24.04,debian:bookworm,rockylinux:9,fedora:43,alpine:3.22"

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # ===========================================================================
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_hosted: ${{ steps.plan.outputs.matrix_hosted }}
      matrix_containers: ${{ steps.plan.outputs.matrix_containers }}
      has_hosted: ${{ steps.plan.outputs.has_hosted }}
      has_containers: ${{ steps.plan.outputs.has_containers }}
      has_homebrew: ${{ steps.plan.outputs.has_homebrew }}
      docker: ${{ steps.plan.outputs.docker }}
      homebrew: ${{ steps.plan.outputs.homebrew }}
      version: ${{ steps.plan.outputs.version }}
      previous_version: ${{ steps.plan.outputs.previous_version }}
      parallel: ${{ steps.plan.outputs.parallel }}
      repeat: ${{ steps.plan.outputs.repeat }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Plan
        id: plan
        env:
          PACKAGE: ${{ secrets.PKG }}
          INPUT_LEVEL: ${{ inputs.level }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_PYTHON: ${{ inputs.python }}
          INPUT_METHODS: ${{ inputs.methods }}
          INPUT_INSTALLERS: ${{ inputs.installers }}
          INPUT_IMAGES: ${{ inputs.images }}
        run: |
          python3 scripts/plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 14

  # ===========================================================================
  # ===========================================================================
  hosted:
    name: "${{ matrix.os }}/${{ matrix.python }}/${{ matrix.method }}/${{ matrix.installer }}"
    needs: plan
    if: ${{ needs.plan.outputs.has_hosted == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_hosted) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Get plan
        uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Check
        shell: bash
        env:
          CELL_ID: "${{ matrix.os }}/${{ matrix.python }}/${{ matrix.method }}/${{ matrix.installer }}"
          PACKAGE_ORG: ${{ secrets.ORG }}
        run: |
          python3 scripts/install_check.py \
            --plan plan.json \
            --cell-id "$CELL_ID" \
            --method "${{ matrix.method }}" \
            --installer "${{ matrix.installer }}" \
            --os "${{ matrix.os }}" \
            --python "${{ matrix.python }}" \
            --out "cell-${CELL_ID//\//_}.json" \
            --work-dir "$RUNNER_TEMP/install-check"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cell-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.method }}-${{ matrix.installer }}"
          path: "cell-*.json"
          retention-days: 14

  # ===========================================================================
  # ===========================================================================
  containers:
    name: "${{ matrix.image }}/${{ matrix.method }}"
    needs: plan
    if: ${{ needs.plan.outputs.has_containers == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix_containers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Prereqs
        shell: sh
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pip git curl
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y python3 python3-pip git curl
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv git curl
          fi
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Get plan
        uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Check
        shell: sh
        env:
          CELL_ID: "${{ matrix.image }}/${{ matrix.method }}/pip"
        run: |
          python3 scripts/install_check.py \
            --plan plan.json \
            --cell-id "$CELL_ID" \
            --method "${{ matrix.method }}" \
            --installer pip \
            --image "${{ matrix.image }}" \
            --out "cell-$(echo "$CELL_ID" | tr '/:' '_').json" \
            --work-dir /tmp/install-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cell-${{ matrix.image }}-${{ matrix.method }}"
          path: "cell-*.json"
          retention-days: 14

  # ===========================================================================
  # ===========================================================================
  docker:
    name: Docker
    needs: plan
    if: ${{ needs.plan.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Docker
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PKG: ${{ secrets.PKG }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ secrets.ORG }}/${{ secrets.PKG }}"
          docker pull "$IMAGE:latest"
          GOT=$(docker run --rm "$IMAGE:latest" ${{ secrets.PKG }} --version 2>&1 | head -1)
          echo "Docker reports: $GOT"
          echo '{"schema":1,"cell":{"id":"docker","os":"","python":"","method":"docker","installer":"docker","image":"'"$IMAGE"'"},"runs":[{"round":1,"worker":0,"ok":true,"total_ms":0,"installed_version":"'"$GOT"'","stages":[{"name":"pull","ok":true,"ms":0,"attempts":1,"error":""},{"name":"verify","ok":true,"ms":0,"attempts":1,"error":""}]}],"package":"","version":"'"$VERSION"'","previous_version":"","level":{"parallel":1,"repeat":1,"soak_minutes":0,"no_cache":false,"cycle":false},"host":{"platform":"Linux","python":"docker","arch":"x86_64"},"summary":{"runs":1,"ok":1,"failed":0,"wall_ms":0}}' > cell-docker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-docker
          path: cell-docker.json
          retention-days: 14

  # ===========================================================================
  # ===========================================================================
  homebrew:
    name: "Homebrew (${{ matrix.os }})"
    needs: plan
    if: ${{ needs.plan.outputs.has_homebrew == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.plan.outputs.homebrew) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Brew
        run: |
          set -euo pipefail
          brew tap ${{ secrets.TAP }}
          brew install ${{ secrets.TAP }}/${{ secrets.PKG }}
          GOT=$(${{ secrets.PKG }} --version 2>&1 | head -1)
          echo "Homebrew reports: $GOT"
          echo '{"schema":1,"cell":{"id":"homebrew/${{ matrix.os }}","os":"${{ matrix.os }}","python":"","method":"homebrew","installer":"homebrew","image":""},"runs":[{"round":1,"worker":0,"ok":true,"total_ms":0,"installed_version":"'"$GOT"'","stages":[{"name":"install","ok":true,"ms":0,"attempts":1,"error":""},{"name":"verify","ok":true,"ms":0,"attempts":1,"error":""}]}],"package":"","version":"","previous_version":"","level":{"parallel":1,"repeat":1,"soak_minutes":0,"no_cache":false,"cycle":false},"host":{"platform":"'"$(uname)"'","python":"homebrew","arch":"'"$(uname -m)"'"},"summary":{"runs":1,"ok":1,"failed":0,"wall_ms":0}}' > "cell-homebrew-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "cell-homebrew-${{ matrix.os }}"
          path: "cell-homebrew-*.json"
          retention-days: 14

  # ===========================================================================
  # ===========================================================================
  report:
    name: Report
    needs: [plan, hosted, containers, docker, homebrew]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Download all cell results
        uses: actions/download-artifact@v4
        with:
          path: results
          pattern: cell-*
          merge-multiple: true
      - name: Report
        run: |
          python3 scripts/report.py \
            --results results \
            --md report.md \
            --json report.json \
            --strict
      - name: Append to job summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            report.md
            report.json
          retention-days: 30
